<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vehicle control panels</title>
<link rel="stylesheet" href="/css/style.css">
<style>body{padding:16px;background:var(--bg)} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px} h3{font:600 14px/1.3 var(--font-sans);margin:0 0 8px} section{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}</style>
</head><body><div class="grid" id="g"></div>
<script type="module">
import { CLUSTERS } from '/js/lib/automobile/corolla-controls.js';
import { mountControlPanel } from '/js/lib/automobile/control-panel.js';
const g = document.getElementById('g');
const only = new URLSearchParams(location.search).get('c');
for (const cl of CLUSTERS.filter(c => !only || only.split(',').includes(c.id))) {
  const s = document.createElement('section');
  s.innerHTML = `<h3>${cl.name} <small style="font-weight:400;color:var(--text-3)">· ${cl.where}</small></h3><div></div>`;
  g.appendChild(s);
  mountControlPanel(s.lastElementChild, cl, { hinted: [cl.rows[0][0].id] });
}
</script></body></html>
