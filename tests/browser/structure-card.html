<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D structure card harness</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>body { padding: 24px; background: var(--bg); } .card { max-width: 900px; margin: 0 auto 32px; }</style>
</head>
<body>
  <!--
    Browser harness for the Assistant's model_3d card.
    Run the dev server (npm run dev) and open /tests/browser/structure-card.html?case=dome
  -->
  <script type="module">
    import { renderStructureModel } from '/js/lib/assistant/structure-card.js';
    const cases = {
      dome: { title: 'Geodesic greenhouse', description: 'A 4-frequency geodesic dome, 20 m across, glazed.', objects: [
        { type: 'dome', radius: 10, frequency: 4, panels: true, material: 'paint', color: '#e8e6e1' },
        { type: 'person', at: [12, 0, 4] }, { type: 'tree', kind: 'palm', height: 8, at: [-14, 0, 6] } ] },
      tower: { title: 'Office tower frame', objects: [
        { type: 'frame', bays: [4, 3], bay: [7.5, 6], storeys: 12, storey_height: 3.6, facade: 'glass', core: true, bracing: true },
        { type: 'person', at: [-3, 0, -3] } ] },
      bridge: { title: 'Suspension footbridge', objects: [ { type: 'bridge', kind: 'suspension', span: 120, width: 6, clearance: 12 } ] },
      truss: { title: 'Warehouse roof trusses', objects: [
        { type: 'array', count: 7, step: [0, 0, 6], item: { type: 'truss', kind: 'pitched', span: 24, height: 4, panels: 12 }, at: [0, 7, 0] },
        { type: 'column_grid', count: [2, 7], spacing: [24, 6], height: 7, section: 'UC 254x254x73', material: 'steel' },
        { type: 'person', at: [10, 0, 10] } ] },
      pavilion: { title: 'Pavilion', environment: 'outdoor', objects: [
        { type: 'hypar', size: [14, 14], rise: 3, at: [-7, 5, -7] },
        { type: 'array', count: 4, around: { center: [0, 0, 0], angle: 360 }, item: { type: 'column', from: [6.5, 0, 6.5], to: [6.5, 5, 6.5], section: '350x350', material: 'concrete' } },
        { type: 'stair', kind: 'spiral', rise: 4, radius: 1.3, at: [0, 0, 0] },
        { type: 'lathe', profile: [[0, 0], [0.6, 0], [0.4, 0.3], [0.35, 1.0], [0.5, 1.2], [0, 1.2]], at: [9, 0, 0], material: 'marble' } ] },
      lattice: { title: 'Telecom mast', objects: [ { type: 'tower', height: 45, base: 6, top: 1.6, antenna: 6 } ] },
    };
    const want = new URLSearchParams(location.search).get('case');
    for (const [name, spec] of Object.entries(cases)) {
      if (want && want !== name) continue;
      const box = document.createElement('div');
      box.className = 'card';
      document.body.appendChild(box);
      renderStructureModel({ spec }, box);
    }
  </script>
</body>
</html>
