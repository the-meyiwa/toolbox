<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Car controls card harness</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>body { padding: 16px; background: var(--bg); } .card { max-width: 720px; margin: 0 auto 28px; }</style>
</head>
<body>
  <!--
    Browser harness for the Assistant's "One of these?" card (vehicle_controls).
    Run the dev server (npm run dev) and open /tests/browser/vehicle-controls-card.html.
    ?q=your question runs one query; no parameter runs a few examples.
    Add &part to run vehicle_part ("where is the …"), or &injury to run car_injury.
  -->
  <script type="module">
    import { executeExtraTool } from '/js/lib/assistant/extra-tools.js';
    import { renderVehicleControls, renderVehiclePart, renderCarInjury } from '/js/lib/assistant/renderers.js';
    const q = new URLSearchParams(location.search).get('q');
    const queries = q ? [q] : ["There's a button on the door of my Toyota, what is it for?", 'orange light that looks like an engine', 'how do I open the fuel door'];
    for (const query of queries) {
      const box = document.createElement('div');
      box.className = 'card';
      document.body.appendChild(box);
      const params = new URLSearchParams(location.search);
      const tool = params.has('injury') ? 'car_injury' : params.has('part') ? 'vehicle_part' : 'vehicle_controls';
      const result = await executeExtraTool(tool, { query });
      ({ car_injury: renderCarInjury, vehicle_part: renderVehiclePart, vehicle_controls: renderVehicleControls })[tool](result, box);
    }
  </script>
</body>
</html>
